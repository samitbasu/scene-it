# The commit gate on GitHub's runners: scripts/check.sh, exactly as it runs locally. check.sh
# decides for itself whether a change is docs-only, so there's no path filter here.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # macOS minutes on a private repository are billed at 10x, so nothing runs until the
    # repository is public, where standard runners are free.
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check.sh diffs against the merge-base with origin/main, so it needs the history.
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version

      - name: scripts/check.sh
        run: scripts/check.sh

      - name: Upload the gate's logs and result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/check/
          if-no-files-found: ignore
          retention-days: 14
